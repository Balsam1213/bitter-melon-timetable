name: Release

# 打 v* tag 自动发版：校验版本号 → 质量门禁 → 正式签名构建 → 挂 APK 到 GitHub Release。
# 签名密钥走 GitHub 加密 Secrets（配置方法见 docs/06-release-checklist.md），不进仓库。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "v$VN" != "$TAG" ]; then
            echo "::error::tag $TAG 与 versionName v$VN 不一致，请核对 app/build.gradle.kts 与 CHANGELOG"
            exit 1
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 Secret，正式签名无法进行（配置方法见 docs/06-release-checklist.md）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release（正式签名 + ABI 拆分）
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build release notes（CHANGELOG 段落 + 固定安装/升级说明）
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p notes
          awk -v t="${TAG#v}" '
            $0 ~ "^## v"t { flag = 1; next }
            /^## v/ && flag { exit }
            flag { print }
          ' devlog/CHANGELOG.md > notes/body.md
          if [ ! -s notes/body.md ]; then
            echo "::warning::CHANGELOG 中未找到 v${TAG#v} 段落，使用占位说明"
            echo "见 [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/devlog/CHANGELOG.md)。" > notes/body.md
          fi
          cat .github/release-notes-footer.md >> notes/body.md

      - name: Create GitHub Release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes/body.md \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            app/build/outputs/apk/release/app-x86_64-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk
